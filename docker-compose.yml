# docker-compose.yml — neo-KIAS
#
# Vier Dienste, drei davon aus einem Image:
#
#   rest-kias   REST-Schnittstelle. Liest die DBF-Daten und beantwortet
#               /api/*. Hier hängen die Datenträger, hier dauert der Start
#               die bekannten ein bis zwei Minuten. Die App athena-KIAS
#               spricht diesen Dienst direkt an.
#   neo-kias    React-Oberfläche. Liefert das gebaute Bündel aus und reicht
#               /api/* an rest-kias weiter, damit die Seite mit einer
#               einzigen Herkunft auskommt. Startet in Sekunden und zeigt
#               den Ladebildschirm, während rest-kias noch liest.
#   admin-kias  Vue-Verwaltung: Datenpfad und Neu-Einlesen, hinter einem
#               Passwort. Nur im Profil "admin".
#   kias-db     Postgres für die Einstellungen, die die Verwaltung ändern
#               darf. Nicht für die KIAS-Daten selbst, die bleiben in den
#               DBF-Dateien. Ebenfalls nur im Profil "admin".
#
# Dazu drei weitere im Profil "logs", die nichts mit der Anwendung selbst
# zu tun haben: kias-loki sammelt die Protokolle, kias-alloy liefert sie
# dorthin, kias-grafana zeigt sie an (Port 5178).
#
# Verwaltung ein oder aus: COMPOSE_PROFILES in der .env (siehe dort).
# Mit Protokollen also COMPOSE_PROFILES=admin,logs.
#
# The image is always built from the sources in this repository; there is
# no pre-built image to pull. Configuration comes from a sibling .env file:
# copy .env.example to .env and point KIAS_DATA_DIR at the folder holding
# the Daten/, Update/ and Formulare/ subdirectories.
#
#     docker compose up -d --build
#
services:
  # ── REST-Schnittstelle ────────────────────────────────────────────────
  rest-kias:
    build:
      context: .
      dockerfile: Dockerfile
    # Local tag for the image built above. Nothing is pulled from a registry.
    image: neo-kias:local
    container_name: rest-kias
    restart: unless-stopped

    # Direkter Zugang für die App und für andere Clients. Die Oberfläche
    # braucht diesen Port nicht, sie geht durch das Compose-Netz.
    ports:
      - "${API_PORT:-5176}:5175"

    environment:
      KIAS_ROLE: api
      # Inside the container the data root is always /data and logs go to
      # /logs — the host paths are mapped via the volumes below.
      KIAS_ROOT: /data
      KIAS_CAR_IMAGES_DIR: /car-images
      # Off by default — set KIAS_SHOW_CAR_IMAGES=true in .env to enable
      # the photo / silhouette area in the Fahrzeuge cards.
      KIAS_SHOW_CAR_IMAGES: "${KIAS_SHOW_CAR_IMAGES:-false}"
      # Search tuning: precomputed lowercase blobs (faster, ~100 MB more
      # heap) and how many filter combinations stay memoized.
      KIAS_SEARCH_BLOBS: "${KIAS_SEARCH_BLOBS:-true}"
      KIAS_SEARCH_CACHE: "${KIAS_SEARCH_CACHE:-50}"
      # Update history / "Änderungen" page. false disables tracking.
      KIAS_HISTORY: "${KIAS_HISTORY:-true}"
      # Swagger UI unter /api/docs.
      KIAS_API_DOCS: "${KIAS_API_DOCS:-true}"
      # Anzeigename in der App, siehe /api/ping.
      KIAS_SERVER_NAME: "${KIAS_SERVER_NAME:-}"
      # Verwaltung: schaltet /api/admin/* und damit auch das Neu-Einlesen
      # frei. Auf "false" gibt es keinen Weg mehr, die Daten neu zu lesen.
      KIAS_ADMIN: "${KIAS_ADMIN:-true}"
      KIAS_ADMIN_PASSWORD: "${KIAS_ADMIN_PASSWORD:-}"
      KIAS_ADMIN_SESSION_HOURS: "${KIAS_ADMIN_SESSION_HOURS:-8}"
      # Einstellungen (bislang der Datenpfad). Ohne Datenbank gilt allein
      # die .env, und die Verwaltung kann den Pfad nicht speichern.
      DATABASE_URL: "${DATABASE_URL:-postgres://kias:${POSTGRES_PASSWORD:-kias}@kias-db:5432/kias}"
      LOG_DIR: /logs
      # Eigene Datei je Dienst: zwei Prozesse dürfen nicht in dieselbe
      # rotierende Datei schreiben.
      LOG_FILE: rest-kias.log
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_MAX_SIZE: "${LOG_MAX_SIZE:-10m}"
      LOG_MAX_FILES: "${LOG_MAX_FILES:-14}"
      LOG_FREQUENCY: "${LOG_FREQUENCY:-daily}"
      LOG_STDOUT: "${LOG_STDOUT:-true}"
      PORT: "5175"
      HOST: "0.0.0.0"
      NODE_ENV: production
      TZ: "${TZ:-Europe/Berlin}"

    volumes:
      # Read-only mount of the DBF data folder (Daten/, Update/, Formulare/).
      # The :? syntax makes "docker compose up" fail loudly if KIAS_DATA_DIR
      # is not set in .env — better than silently mounting nothing.
      - "${KIAS_DATA_DIR:?Set KIAS_DATA_DIR in .env to the host path containing Daten/, Update/, Formulare/}:/data:ro"
      # Writable mount for rotated log files. Defaults to ./logs in the
      # compose directory. The host path must be writable by uid 1000
      # (the container's "node" user).
      - "${KIAS_LOG_DIR:-./logs}:/logs"
      # Optional read-only mount for car-model photos. Drop transparent
      # PNG/WebP files named <model-slug>.<ext> in here (see README for
      # filename rules). If the directory is empty or doesn't exist, the
      # UI falls back to generic SVG silhouettes.
      - "${KIAS_CAR_IMAGES_DIR:-./car-images}:/car-images:ro"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5175/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    # tmpfs so the container's writable layer stays small.
    tmpfs:
      - /tmp

  # ── React-Oberfläche ──────────────────────────────────────────────────
  neo-kias:
    # Dasselbe Image wie oben; der zweite Bau ist ein Treffer im Cache.
    build:
      context: .
      dockerfile: Dockerfile
    image: neo-kias:local
    container_name: neo-kias
    restart: unless-stopped

    # Der Einstieg für Menschen. Bleibt auf 5175, damit Lesezeichen gelten.
    ports:
      - "${HOST_PORT:-5175}:5175"

    environment:
      KIAS_ROLE: web
      # Dienstname aus diesem Compose-Netz, nicht vom Browser aufgelöst.
      KIAS_API_URL: "${KIAS_API_URL:-http://rest-kias:5175}"
      LOG_DIR: /logs
      LOG_FILE: neo-kias.log
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_MAX_SIZE: "${LOG_MAX_SIZE:-10m}"
      LOG_MAX_FILES: "${LOG_MAX_FILES:-14}"
      LOG_FREQUENCY: "${LOG_FREQUENCY:-daily}"
      LOG_STDOUT: "${LOG_STDOUT:-true}"
      PORT: "5175"
      HOST: "0.0.0.0"
      NODE_ENV: production
      TZ: "${TZ:-Europe/Berlin}"

    volumes:
      - "${KIAS_LOG_DIR:-./logs}:/logs"

    # Nur die Startreihenfolge, nicht "gesund": rest-kias meldet sich erst
    # nach dem Einlesen gesund, die Oberfläche soll aber vorher schon den
    # Ladebildschirm zeigen können.
    depends_on:
      - rest-kias

    # Eigene Lebendprüfung. /api/health ginge durch den Weiterleiter und
    # würde den Zustand von rest-kias melden.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5175/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    tmpfs:
      - /tmp

  # ── Verwaltung (Vue) ──────────────────────────────────────────────────
  # Läuft nur mit COMPOSE_PROFILES=admin in der .env. Ohne sie gibt es
  # keine Verwaltung und damit auch keinen Weg, die Daten neu einzulesen.
  admin-kias:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: Dockerfile
    image: neo-kias:local
    container_name: admin-kias
    restart: unless-stopped

    ports:
      - "${ADMIN_PORT:-5177}:5175"

    environment:
      KIAS_ROLE: admin
      KIAS_API_URL: "${KIAS_API_URL:-http://rest-kias:5175}"
      LOG_DIR: /logs
      LOG_FILE: admin-kias.log
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_MAX_SIZE: "${LOG_MAX_SIZE:-10m}"
      LOG_MAX_FILES: "${LOG_MAX_FILES:-14}"
      LOG_FREQUENCY: "${LOG_FREQUENCY:-daily}"
      LOG_STDOUT: "${LOG_STDOUT:-true}"
      PORT: "5175"
      HOST: "0.0.0.0"
      NODE_ENV: production
      TZ: "${TZ:-Europe/Berlin}"

    volumes:
      - "${KIAS_LOG_DIR:-./logs}:/logs"

    depends_on:
      - rest-kias

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5175/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    tmpfs:
      - /tmp

  # ── Einstellungen (Postgres) ──────────────────────────────────────────
  # Hier liegt nur, was die Verwaltung verstellen darf, derzeit der
  # Datenpfad. Die KIAS-Daten selbst bleiben in den DBF-Dateien.
  # Absichtlich ohne Port nach außen: den braucht nur rest-kias, und der
  # steht im selben Netz.
  kias-db:
    profiles: ["admin"]
    image: postgres:16-alpine
    container_name: kias-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: kias
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-kias}"
      POSTGRES_DB: kias
      TZ: "${TZ:-Europe/Berlin}"

    volumes:
      - kias-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kias -d kias"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Protokolle: Loki, Alloy, Grafana ──────────────────────────────────
  # Nur mit "logs" in COMPOSE_PROFILES. Drei Container, zusammen etwa
  # 300 MB Arbeitsspeicher: auf einem Server nichts, auf einem kleinen
  # Testrechner spürbar. Deshalb abschaltbar und ab Werk aus.
  #
  # Sinn der Sache: die Protokolle durchsuchbar machen, statt sie mit
  # "docker compose logs | grep" zu durchkämmen. Vor allem die Zeilen der
  # Ladeläufe, an denen zu sehen ist, wann ein Bestand leer wurde.

  kias-loki:
    profiles: ["logs"]
    image: grafana/loki:3.3.2
    container_name: kias-loki
    restart: unless-stopped
    # expand-env, damit die Aufbewahrung aus der .env kommen kann.
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]

    environment:
      LOKI_RETENTION: "${LOKI_RETENTION:-720h}"
      TZ: "${TZ:-Europe/Berlin}"

    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - kias-loki-data:/loki

    # Absichtlich ohne Port nach außen: Loki spricht nur mit Alloy und
    # Grafana, und beide stehen im selben Netz.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  kias-alloy:
    profiles: ["logs"]
    image: grafana/alloy:v1.5.1
    container_name: kias-alloy
    restart: unless-stopped
    # root, weil der Docker-Socket sonst nicht zu lesen ist.
    user: root
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy

    environment:
      TZ: "${TZ:-Europe/Berlin}"

    volumes:
      # Welche der beiden Fassungen gilt, steht in der .env: der
      # Docker-Socket liefert mehr, die Dateifassung kommt ohne ihn aus.
      - "./observability/alloy/${ALLOY_CONFIG:-config.alloy}:/etc/alloy/config.alloy:ro"
      # Lesend. Alloy soll Container sehen, nicht steuern.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${KIAS_LOG_DIR:-./logs}:/logs:ro"
      # Merkt sich, wie weit gelesen wurde. Ohne das fängt Alloy nach
      # jedem Neustart von vorn oder verliert den Anschluss.
      - kias-alloy-data:/var/lib/alloy/data

    depends_on:
      kias-loki:
        condition: service_healthy

  kias-grafana:
    profiles: ["logs"]
    image: grafana/grafana:11.4.0
    container_name: kias-grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT:-5178}:3000"

    environment:
      # Dieselben Zugangsdaten wie die Verwaltung. Kein einmaliges
      # Anmelden über beide, aber ein Passwort statt zweier.
      GF_SECURITY_ADMIN_USER: "${KIAS_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${KIAS_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Ein Werkstattrechner meldet nichts nach Hause und braucht keine
      # Neuigkeiten aus der Grafana-Welt.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_LEVEL: warn
      TZ: "${TZ:-Europe/Berlin}"

    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - kias-grafana-data:/var/lib/grafana

    depends_on:
      kias-loki:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  kias-db-data:
  kias-loki-data:
  kias-alloy-data:
  kias-grafana-data:
